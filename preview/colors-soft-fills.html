<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 18px 24px; background: var(--bg); }
  .row { display: flex; gap: 14px; }
  .swatch {
    flex: 1; height: 110px; border-radius: 10px; padding: 10px 12px;
    display: flex; flex-direction: column; justify-content: space-between;
    border: 1px solid var(--border); font-family: var(--sans);
  }
  .swatch .name { font-weight: 600; font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .swatch .hex  { font-family: ui-monospace, Menlo, monospace; font-size: 0.72rem; opacity: 0.7; color: var(--text); }
  .swatch .name { color: var(--text); }
</style></head><body>
<div class="row">
  <div class="swatch" style="background: rgba(196, 92, 74, 0.14)"><span class="name">Accent soft</span><span class="hex">rgba(196,92,74,.14)</span></div>
  <div class="swatch" style="background: rgba(139, 115, 85, 0.12)"><span class="name">Accent 2 soft</span><span class="hex">rgba(139,115,85,.12)</span></div>
  <div class="swatch" style="background: rgba(184, 134, 11, 0.12)"><span class="name">Gold soft</span><span class="hex">rgba(184,134,11,.12)</span></div>
  <div class="swatch" style="background: #e8e2dc"><span class="name">Border</span><span class="hex">#E8E2DC</span></div>
</div>
</body></html>
