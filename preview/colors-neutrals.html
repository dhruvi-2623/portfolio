<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 18px 24px; background: var(--bg); }
  .row { display: flex; gap: 14px; }
  .swatch {
    flex: 1; height: 110px; border-radius: 10px; padding: 10px 12px;
    display: flex; flex-direction: column; justify-content: space-between;
    border: 1px solid var(--border); font-family: var(--sans);
  }
  .swatch .name { font-weight: 600; font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; }
  .swatch .hex  { font-family: ui-monospace, Menlo, monospace; font-size: 0.72rem; opacity: 0.7; }
  .ink  { color: var(--text); }
  .ink-muted { color: var(--text-muted); }
  .light { color: #f6f2ec; }
</style></head><body>
<div class="row">
  <div class="swatch ink"        style="background:#faf7f4"><span class="name">Bg</span><span class="hex">#FAF7F4</span></div>
  <div class="swatch ink"        style="background:#fdf8f5"><span class="name">Bg warm</span><span class="hex">#FDF8F5</span></div>
  <div class="swatch ink"        style="background:#ffffff"><span class="name">Surface</span><span class="hex">#FFFFFF</span></div>
  <div class="swatch light"      style="background:#1e1b18"><span class="name">Text</span><span class="hex">#1E1B18</span></div>
  <div class="swatch light"      style="background:#6b6560"><span class="name">Text muted</span><span class="hex">#6B6560</span></div>
</div>
</body></html>
