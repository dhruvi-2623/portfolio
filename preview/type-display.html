<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 22px 28px; background: var(--bg); }
  .row { display: grid; gap: 14px; }
  .specimen { display: flex; align-items: baseline; gap: 18px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .specimen:last-child { border: 0; }
  .label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.12em; min-width: 88px; }
  .sample { color: var(--text); }
  .display { font-family: var(--serif); font-size: 3rem; font-weight: 400; line-height: 0.95; letter-spacing: -0.02em; }
  .h2 { font-family: var(--serif); font-size: 1.85rem; line-height: 1.15; }
  .h3 { font-family: var(--sans); font-weight: 600; font-size: 1.1rem; }
</style></head><body>
<div class="row">
  <div class="specimen"><span class="label">Display</span><span class="sample display">Crafting software that ships</span></div>
  <div class="specimen"><span class="label">H2 serif</span><span class="sample h2">A selection of my work</span></div>
  <div class="specimen"><span class="label">H3 sans</span><span class="sample h3">Realtime Chat Application</span></div>
</div>
</body></html>
