<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 22px 24px; background: var(--bg); }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 0.65rem 1.35rem; font-size: 0.9rem;
    font-family: var(--sans); font-weight: 500; text-decoration: none;
    border-radius: 10px; transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: #fff; box-shadow: var(--shadow); border: 0;
  }
  .btn-secondary {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); box-shadow: var(--shadow-xs);
  }
  .badge {
    display: inline-block; font-size: 0.75rem; padding: 0.35rem 0.85rem;
    background: linear-gradient(135deg, var(--accent-soft) 0%, var(--gold-soft) 100%);
    color: var(--accent-dark); border-radius: 999px; font-weight: 600; letter-spacing: 0.02em;
    font-family: var(--sans);
  }
</style></head><body>
<div class="row">
  <a class="btn btn-primary" href="#">View my work</a>
  <a class="btn btn-secondary" href="#">Get in touch</a>
  <span class="badge">Open to work</span>
</div>
</body></html>
