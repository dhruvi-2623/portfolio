<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 22px 24px; background: var(--bg); font-family: var(--sans); }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 1.25rem 1.35rem;
    border-left: 3px solid var(--accent);
    box-shadow: var(--shadow); max-width: 540px;
  }
  h4 { margin: 0 0 0.35rem; font-size: 0.95rem; font-weight: 600; color: var(--text); }
  p { margin: 0; font-size: 0.85rem; line-height: 1.55; color: var(--text-muted); }
</style></head><body>
<div class="card">
  <h4>Frontend Engineering</h4>
  <p>React, TypeScript, component systems, and performance-focused UI — code-splitting, accessibility, and clean UX.</p>
</div>
</body></html>
