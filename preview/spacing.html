<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 20px 24px; background: var(--bg); font-family: var(--sans); color: var(--text); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 14px; align-items: end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--accent); border-radius: 4px; width: 100%; }
  .name { font-weight: 600; font-size: 0.78rem; letter-spacing: 0.04em; }
  .px { font-family: ui-monospace, Menlo, monospace; font-size: 0.72rem; opacity: 0.6; }
</style></head><body>
<div class="grid">
  <div class="item"><div class="bar" style="height:4px"></div><span class="name">--sp-1</span><span class="px">4 / .25rem</span></div>
  <div class="item"><div class="bar" style="height:12px"></div><span class="name">--sp-3</span><span class="px">12 / .75rem</span></div>
  <div class="item"><div class="bar" style="height:24px"></div><span class="name">--sp-6</span><span class="px">24 / 1.5rem</span></div>
  <div class="item"><div class="bar" style="height:48px"></div><span class="name">--sp-12</span><span class="px">48 / 3rem</span></div>
  <div class="item"><div class="bar" style="height:80px"></div><span class="name">--sp-20</span><span class="px">80 / 5rem</span></div>
</div>
</body></html>
