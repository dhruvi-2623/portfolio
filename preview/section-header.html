<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 22px 24px; background: var(--bg); font-family: var(--sans); }
  .label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin: 0 0 0.5rem; display: flex; align-items: center; gap: 0.75rem; font-weight: 500; }
  .label::before {
    content: ''; width: 24px; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 1px;
  }
  h2 { font-family: var(--serif); font-size: 1.85rem; font-weight: 400; margin: 0 0 0.5rem; color: var(--text); }
  p { font-size: 0.95rem; color: var(--text-muted); margin: 0; max-width: 50ch; }
</style></head><body>
<p class="label">Featured Projects</p>
<h2>A selection of my work</h2>
<p>Real-time systems, healthcare platforms, food ordering, and stock exchange tooling—built with modern stacks.</p>
</body></html>
