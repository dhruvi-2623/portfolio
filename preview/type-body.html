<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 22px 28px; background: var(--bg); }
  .row { display: grid; gap: 12px; }
  .specimen { display: flex; align-items: baseline; gap: 18px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .specimen:last-child { border: 0; }
  .label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.12em; min-width: 88px; }
  .sample { color: var(--text); }
  .body { font-size: 1rem; line-height: 1.6; }
  .small { font-size: 0.85rem; color: var(--text-muted); }
  .meta { font-size: 0.8rem; color: var(--text-muted); letter-spacing: 0.04em; }
  .eyebrow { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); font-weight: 500; }
</style></head><body>
<div class="row">
  <div class="specimen"><span class="label">Eyebrow</span><span class="sample eyebrow">Featured Projects</span></div>
  <div class="specimen"><span class="label">Body</span><span class="sample body">I build full-stack web apps with React, Node, and Azure.</span></div>
  <div class="specimen"><span class="label">Small</span><span class="sample small">Houston, Texas · Open to Work</span></div>
  <div class="specimen"><span class="label">Meta</span><span class="sample meta">Jan 2026 – Present (2 mos)</span></div>
</div>
</body></html>
