<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 22px 24px; background: var(--bg); }
  .row { display: flex; gap: 0.5rem; flex-wrap: wrap; font-family: var(--sans); }
  .pill {
    font-size: 0.72rem; padding: 0.3rem 0.7rem; border-radius: 999px;
    font-weight: 500;
  }
  .a { background: var(--accent-soft); color: var(--accent-dark); }
  .b { background: var(--accent-2-soft); color: var(--accent-2); }
  .c { background: var(--gold-soft); color: var(--gold-ink); }
  .outline {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border);
  }
</style></head><body>
<div class="row">
  <span class="pill a">React</span>
  <span class="pill b">Node</span>
  <span class="pill c">Socket.IO</span>
  <span class="pill a">MongoDB</span>
  <span class="pill b">JWT</span>
  <span class="pill c">Azure</span>
  <span class="pill outline">TypeScript</span>
  <span class="pill outline">Docker</span>
  <span class="pill outline">CI/CD</span>
</div>
</body></html>
